spring.application.name=HireRight

spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:hireright}?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}
jwt.secret=${JWT_SECRET}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

resend.api.key=${RESEND_API_KEY}
resend.from.address=${RESEND_FROM_ADDRESS:HireRight <otp@myhireright.me>}